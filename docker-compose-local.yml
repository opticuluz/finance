services:
  app:
    build:
      context: .
      args:
        - DEV=true
    restart: unless-stopped
    volumes:
      - ./app:/app
      - static_data:/vol/static
      - media_data:/vol/media
      - logs_data:/app_logs
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py makemigrations --noinput &&
             python manage.py migrate && 
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DOMAIN}
      - DJANGO_DEBUG=1
      - DB_HOST=db
      - DB_NAME=finance_db
      - DB_USER=postgres_user
      - DB_PASS=postgres_password
      - REDIS_HOST=redis
    container_name: finance_app
    depends_on:
      - db
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.finance.entrypoints=web"
      - "traefik.http.services.finance.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"
    networks:
      - proxy
      - internal

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=finance_db
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=postgres_password
    container_name: finance_db
    networks:
      - internal

  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    container_name: finance_redis
    networks:
      - internal

  celery-beat: &celery
    build:
      context: .
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=finance.settings
      - DB_HOST=db
      - DB_NAME=finance_db
      - DB_USER=postgres_user
      - DB_PASS=postgres_password
      - REDIS_HOST=redis
      - DJANGO_ALLOWED_HOSTS=${DOMAIN}
    volumes:
      - ./app:/app:consistent,uid=1000,gid=1000
    depends_on:
      - redis
      - db
      - app
    command: >
      sh -c "celery -A finance purge -f &&
             celery -A finance beat -l debug --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    container_name: finance_celery_beat
    networks:
      - internal

  celery-worker:
    <<: *celery
    command: celery -A finance worker -l debug -E
    container_name: finance_celery_worker
    networks:
      - internal

  celery-flower:
    <<: *celery
    ports:
      - 5555:5555
    command: celery -A finance flower
    container_name: finance_celery_flower
    networks:
      - internal

volumes:
  db-data:
  redis-data:
  static_data:
  media_data:
  logs_data:

networks:
  proxy:
    external: true
  internal:
