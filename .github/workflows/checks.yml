---
name: Checks

on: [push]

env:
  DOMAIN: ${{ secrets.DOMAIN }}
  DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create Docker network
        run: docker network create proxy || true

      - name: Start PostgreSQL service
        run: docker compose -f docker-compose-local.yml up -d db

      - name: Test
        run: docker compose -f docker-compose-local.yml run --rm app sh -c "python manage.py wait_for_db && python manage.py test"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          
      - name: Lint
        run: docker compose -f docker-compose-local.yml run --rm app sh -c "flake8"