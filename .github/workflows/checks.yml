---
name: Checks

on: [push]

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up environment variables
        run: |
          echo ${{ secrets.DB_HOST }}
          echo ${{ secrets.DB_NAME }}
          echo ${{ secrets.DB_USER }}
          echo ${{ secrets.DB_PASS }}          
      - name: Test
        run: docker-compose -f docker-compose-local.yml run --rm app sh -c "python manage.py wait_for_db && python manage.py test"
      - name: Lint
        run: docker-compose -f docker-compose-local.yml run --rm app sh -c "flake8"