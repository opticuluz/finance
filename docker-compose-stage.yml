services:
  app:
    build:
      context: .
      args:
        - DEV=false
    restart: unless-stopped
    volumes:
      - static_data:/vol/static
      - media_data:/vol/media
      - logs_data:/app_logs
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DOMAIN}
      - DJANGO_DEBUG=0
      - DB_HOST=db
      - DB_NAME=finance_db
      - DB_USER=postgres_user
      - DB_PASS=postgres_password
      - REDIS_HOST=redis
    container_name: finance_app
    depends_on:
      - db
      - redis
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.finance.rule=Host(`${DOMAIN}`)"
    #   - "traefik.http.routers.finance.entrypoints=web"
    #   - "traefik.http.services.finance.loadbalancer.server.port=8000"
    networks:
      - proxy

  proxy:
    build:
      context: ./docker/proxy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - 81:80
      # - 443:443
    volumes:
      - static_data:/vol/static
      - media_data:/vol/media
      # - certbot-web:/vol/www
      # - proxy-dhparams:/vol/proxy
      # - certbot-certs:/etc/letsencrypt
    # environment:
    #   - DOMAIN=${DOMAIN}
    container_name: finance_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.finance.entrypoints=websecure"
      - "traefik.http.routers.finance.tls=true"
      - "traefik.http.services.finance.loadbalancer.server.port=80"
    networks:
      - proxy

  # certbot:
  #   build:
  #     context: ./docker/certbot
  #   command: echo "Skipping..."
  #   environment:
  #     - EMAIL=${ACME_DEFAULT_EMAIL}
  #     - DOMAIN=${DOMAIN}
  #   volumes:
  #     - certbot-web:/vol/www
  #     - certbot-certs:/etc/letsencrypt/
  #   depends_on:
  #     - proxy
  #   container_name: finance_certbot
  #   networks:
  #     - proxy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=finance_db
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=postgres_password
    container_name: finance_db
    networks:
      - proxy

  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    container_name: finance_redis
    networks:
      - proxy

  celery-beat: &celery
    build:
      context: .
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=finance.settings
      - DJANGO_ALLOWED_HOSTS=${DOMAIN}
      - DB_HOST=db
      - DB_NAME=finance_db
      - DB_USER=postgres_user
      - DB_PASS=postgres_password
      - REDIS_HOST=redis
    depends_on:
      - redis
      - db
      - app
    command: >
      sh -c "celery -A finance purge -f &&
             celery -A finance beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    container_name: finance_celery_beat
    networks:
      - proxy

  celery-worker:
    <<: *celery
    command: celery -A finance worker -l info -E
    container_name: finance_celery_worker
    networks:
      - proxy
  
  # celery-flower:
  #   <<: *celery
  #   ports:
  #     - 5555:5555
  #   command: celery -A finance flower
    # container_name: finance_celery_flower
    # networks:
    #   - proxy

volumes:
  db-data:
  redis-data:
  static_data:
  media_data:
  logs_data:
  # certbot-web:
  # proxy-dhparams:
  # certbot-certs:

networks:
  proxy:
    external: true
